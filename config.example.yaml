mode: pool  # pool 或 multi-port（也支持 multi_port）
log_level: info
skip_cert_verify: false  # 全局跳过 SSL 证书验证（默认 false）
external_ip: ""  # 外部 IP 地址，用于导出时替换 0.0.0.0（如 1.2.3.4）
management:
  enabled: true
  listen: 0.0.0.0:9090
  probe_target: www.apple.com:80
  password: ""  # WebUI 访问密码，为空则不需要密码（可选）
  api_key: ""   # 订阅 API Key，用于 URL 参数认证（可选）
                # 配置后可通过 /api/export?key=xxx 直接订阅
  hide_unavailable: true  # 是否隐藏不可用节点（默认 true，设为 false 显示所有节点）
listener:
  address: 0.0.0.0
  port: 2323
  username: username
  password: password
pool:
  mode: sequential
  failure_threshold: 3
  blacklist_duration: 24h

# 订阅自动刷新配置
subscription_refresh:
  enabled: false              # 是否启用定时刷新
  interval: 1h                # 刷新间隔，默认 1 小时
  timeout: 30s                # 获取订阅超时时间
  health_check_timeout: 60s   # 新节点健康检查超时
  drain_timeout: 30s          # 旧实例排空超时
  min_available_nodes: 1      # 最少可用节点数，低于此值不切换

multi_port:
  address: 0.0.0.0
  base_port: 24000
  username: mpuser
  password: mppass
  inbound_type: http  # "http"（默认）或 "ss"（Shadowsocks）
  ss_method: aes-128-gcm  # Shadowsocks 加密方式（仅 inbound_type: ss 时生效）
  disable_health_check: false  # multi-port 模式下关闭健康探测（默认 false）
  disable_blacklist: false     # multi-port 模式下关闭拉黑（默认 false）

# ═══════════════════════════════════════════════════════════════
# 节点配置方式（三选一或混合使用）
# ═══════════════════════════════════════════════════════════════

# 方式 1: 使用 nodes_file（推荐，最简单）
# 创建一个文本文件，每行一个代理 URI
# nodes_file: nodes.txt

# 方式 2: 直接在配置文件中配置（传统方式）
nodes:
  # 只需提供 URI，名称会自动从 #后面提取，端口自动分配
  - uri: "vless://uuid@server:443#节点名称"
  - uri: "ss://base64@server:8388#🇨🇳中文节点"

  # 也可以手动指定名称和端口
  - name: tw-vless
    uri: "vless://test"
    port: 24001

# 方式 3: 混合使用（两种方式的节点会合并）
# nodes_file: nodes.txt
# nodes:
#   - uri: "vless://xxx@server:443#额外节点"
